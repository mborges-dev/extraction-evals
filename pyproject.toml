[project]
name = "extraction-evals"
version = "0.1.0"
description = "Reproducible benchmark for LLM-based structured extraction from documents."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Miguel Borges", email = "hello@miguelborges.dev" }]
requires-python = ">=3.12"

dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pytest>=8.3.0",
]

[project.scripts]
extraction-eval = "src.eval:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
